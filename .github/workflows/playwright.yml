name: Playwright Tests

on:
  schedule:
    # 10:30 AM IST → 05:00 UTC
    - cron: '0 5 * * 1-5'

    # 9:30 PM IST → 16:00 UTC
    - cron: '0 16 * * 1-5'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    # Use R001K's copy of checkout action
    - name: Checkout
      uses: R001K/checkout@v3

    # Use R001K's version of setup-node
    - name: Setup Node
      uses: R001K/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test

    # Upload report using R001K-owned action
    - name: Upload Report
      if: always()
      uses: R001K/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
